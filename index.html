<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Private page</title>
<style>
:root{--bg:#f4f5f4;--card:#fff;--ink:#16191b;--mut:#5f676b;--line:#dadfdc;--acc:#0f6e6a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121516;--card:#1b1f21;--ink:#eef1ef;--mut:#9aa4a8;--line:#2e3437;--acc:#4fc2b9;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
label{display:block;font-weight:600;margin-bottom:12px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:600 15px/1 inherit;padding:9px 16px;border:0;border-radius:8px;background:var(--ink);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
p{margin:10px 0 0;color:var(--mut);font-size:14px;min-height:1.3em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <label for="pw">Enter the password</label>
  <div class="row"><input id="pw" type="password" required autofocus><button type="submit">Unlock</button></div>
  <p id="m" role="status"></p>
</form>
<script>
(async function(){
  const meta = await fetch('meta.json').then(r => r.json());
  async function open(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const salt = Uint8Array.from(atob(meta.salt), c => c.charCodeAt(0));
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:meta.iterations, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const buf = new Uint8Array(await (await fetch('page.enc')).arrayBuffer());
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12)));
    window.__DEMO_PW = pw;
    try { sessionStorage.setItem('demo-pw', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  let saved = null; try { saved = sessionStorage.getItem('demo-pw'); } catch (e) {}
  if (saved) { try { await open(saved); return; } catch (e) {} }
  // 5 wrong passwords -> 1 minute cool-down (kept in localStorage, shared with the page's own lock form)
  const COOL = {mem: {}, get() { try { return JSON.parse(localStorage.getItem('demo-fail') || '{}'); } catch (e) { return this.mem; } },
    set(v) { this.mem = v; try { localStorage.setItem('demo-fail', JSON.stringify(v)); } catch (e) {} },
    left() { return Math.max(0, (this.get().until || 0) - Date.now()); },
    fail() { const s = this.get(); s.n = (s.n || 0) + 1; if (s.n >= 5) { s.until = Date.now() + 60000; s.n = 0; } this.set(s); return this.left(); },
    ok() { this.set({}); }};
  function coolDown(btn, input, msg) {
    const tick = () => { const l = COOL.left();
      if (l > 0) { btn.disabled = true; input.disabled = true;
        msg.textContent = 'Too many wrong tries. Try again in ' + Math.ceil(l / 1000) + ' s.'; setTimeout(tick, 500); }
      else { btn.disabled = false; input.disabled = false; msg.textContent = ''; input.focus(); } };
    tick();
  }
  const f = document.getElementById('f'), pw = document.getElementById('pw'), m = document.getElementById('m');
  const b0 = f.querySelector('button');
  if (COOL.left() > 0) coolDown(b0, pw, m);
  f.addEventListener('submit', async e => {
    e.preventDefault(); if (COOL.left() > 0) return coolDown(b0, pw, m);
    b0.disabled = true; m.textContent = 'Unlocking…';
    try { await open(pw.value); COOL.ok(); }
    catch (err) { if (COOL.fail() > 0) { pw.value = ''; return coolDown(b0, pw, m); }
      m.textContent = 'That password is not right. Try again.'; pw.select(); b0.disabled = false; }
  });
})();
</script>
</body>
</html>
